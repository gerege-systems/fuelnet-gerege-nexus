<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <title>Нэвтрэх — Gerege Nexus</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <h1>Open Gerege Nexus</h1>
  <p class="lede">Үргэлжлүүлэхийн тулд нэвтэрнэ үү.</p>

  <div class="tabs" role="tablist">
    <button id="tab-password" class="is-active" type="button">Имэйл</button>
    <button id="tab-id" type="button">eID дугаар</button>
    <button id="tab-qr" type="button">eID QR</button>
  </div>

  <p id="alert" class="alert alert--error hidden"></p>

  <form id="form-password">
    <label for="email">И-мэйл</label>
    <input id="email" type="email" autocomplete="username" required />
    <label for="password">Нууц үг</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button class="primary" type="submit">Нэвтрэх</button>
  </form>

  <form id="form-id" class="hidden">
    <label for="national-id">Регистрийн дугаар</label>
    <input id="national-id" type="text" autocomplete="off" minlength="8" required />
    <button class="primary" type="submit">Хүсэлт илгээх</button>
  </form>

  <section id="waiting" class="center hidden">
    <div id="qr" class="qr hidden"></div>
    <p id="waiting-text" class="muted">Гар утсан дээрээ баталгаажуулна уу.</p>
    <p class="muted">Баталгаажуулах код</p>
    <p id="code" class="code"></p>
    <div class="row"><button id="cancel" type="button">Цуцлах</button></div>
  </section>

  <script>
    // Локал цонх нь Tauri-гийн IPC-ээр л бүрхүүлтэй ярина. Сүлжээний хүсэлт
    // энд огт хийгдэхгүй: session cookie нь ажлын мужийн webview-д л
    // тавигдах ёстой (src-tauri/src/bridge.rs дахь тайлбарыг үз).
    const internals = window.__TAURI_INTERNALS__;
    function invoke(command, payload) {
      if (!internals || typeof internals.invoke !== "function") {
        return Promise.reject(new Error("IPC боломжгүй"));
      }
      return internals.invoke(command, payload || {});
    }

    const el = (id) => document.getElementById(id);
    const views = {
      password: el("form-password"),
      id: el("form-id"),
      qr: null,
    };

    function showAlert(message) {
      const alert = el("alert");
      if (!message) { alert.classList.add("hidden"); alert.textContent = ""; return; }
      alert.textContent = message;
      alert.classList.remove("hidden");
    }

    function showWaiting(on) {
      el("waiting").classList.toggle("hidden", !on);
      for (const key of ["password", "id"]) {
        if (views[key]) views[key].classList.toggle("hidden", on || current !== key);
      }
      document.querySelector(".tabs").classList.toggle("hidden", on);
    }

    let current = "password";
    let busy = false;

    function select(next) {
      current = next;
      showAlert("");
      showWaiting(false);
      el("tab-password").classList.toggle("is-active", next === "password");
      el("tab-id").classList.toggle("is-active", next === "id");
      el("tab-qr").classList.toggle("is-active", next === "qr");
      views.password.classList.toggle("hidden", next !== "password");
      views.id.classList.toggle("hidden", next !== "id");
      if (next === "qr") { startEid(null); }
    }

    el("tab-password").addEventListener("click", () => select("password"));
    el("tab-id").addEventListener("click", () => select("id"));
    el("tab-qr").addEventListener("click", () => select("qr"));

    el("form-password").addEventListener("submit", (event) => {
      event.preventDefault();
      if (busy) return;
      busy = true;
      showAlert("");
      invoke("auth_password_login", { email: el("email").value, password: el("password").value })
        .catch((err) => showAlert(String(err && err.message ? err.message : err)))
        .finally(() => { busy = false; });
    });

    el("form-id").addEventListener("submit", (event) => {
      event.preventDefault();
      startEid(el("national-id").value);
    });

    function startEid(nationalId) {
      if (busy) return;
      busy = true;
      showAlert("");
      invoke("auth_eid_start", { nationalId: nationalId || null })
        .catch((err) => showAlert(String(err && err.message ? err.message : err)))
        .finally(() => { busy = false; });
    }

    el("cancel").addEventListener("click", () => {
      invoke("auth_cancel").catch(() => {});
      select("password");
    });

    // Бүрхүүл төлвөө ЗӨВХӨН энэ цэгээр дамжуулна — JSON-оор кодлогдсон нэг
    // аргумент (гэрээний аюулгүй байдлын шаардлага #3-тай ижил зарчим).
    window.__geregeLogin = function (payloadJSON) {
      let update;
      try { update = JSON.parse(payloadJSON); } catch (e) { return; }
      switch (update.phase) {
        case "starting":
          showAlert("");
          el("waiting-text").textContent = "Хүсэлт илгээж байна...";
          el("code").textContent = "";
          el("qr").classList.add("hidden");
          showWaiting(true);
          break;
        case "waiting":
          showAlert("");
          el("waiting-text").textContent = update.qr_svg
            ? "QR кодыг eID аппаараа уншуулна уу."
            : "Гар утсан дээрээ баталгаажуулна уу.";
          el("code").textContent = update.verification_code || "";
          if (update.qr_svg) {
            el("qr").innerHTML = update.qr_svg;
            el("qr").classList.remove("hidden");
          } else {
            el("qr").classList.add("hidden");
          }
          showWaiting(true);
          break;
        case "success":
          showWaiting(true);
          el("waiting-text").textContent = "Амжилттай нэвтэрлээ.";
          break;
        case "expired":
          showWaiting(false);
          showAlert("Хүсэлтийн хугацаа дууслаа. Дахин оролдоно уу.");
          break;
        case "refused":
          showWaiting(false);
          showAlert("Хүсэлт татгалзагдлаа.");
          break;
        case "error":
          showWaiting(false);
          showAlert(update.message || "Алдаа гарлаа.");
          break;
        default:
          break;
      }
    };

    el("email").focus();
  </script>
</body>
</html>
