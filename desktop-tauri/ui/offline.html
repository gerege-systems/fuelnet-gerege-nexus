<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <title>Холболт — Gerege Nexus</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div class="center">
    <h1>Сервертэй холбогдож чадсангүй</h1>
    <p class="muted">
      Go backend болон Web client хоёулаа ажиллаж байх шаардлагатай.
      Хаягуудыг Тохиргооноос шалгана уу.
    </p>
    <div class="row">
      <button id="retry" class="primary" type="button">Дахин холбогдох</button>
      <button id="prefs" type="button">Тохиргоо...</button>
    </div>
  </div>

  <script>
    const internals = window.__TAURI_INTERNALS__;
    function invoke(command) {
      if (!internals || typeof internals.invoke !== "function") { return; }
      internals.invoke(command, {}).catch(function () {});
    }
    document.getElementById("retry").addEventListener("click", () => invoke("offline_retry"));
    document.getElementById("prefs").addEventListener("click", () => invoke("open_preferences"));
  </script>
</body>
</html>
