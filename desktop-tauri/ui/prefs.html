<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <title>Тохиргоо — Gerege Nexus</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <h1>Серверийн хаяг</h1>
  <p class="lede" id="lede">Хөгжүүлэлтийн build дээр л солигдоно.</p>

  <p id="alert" class="alert hidden"></p>

  <form id="form">
    <label for="api">API хаяг</label>
    <input id="api" type="text" autocomplete="off" spellcheck="false" required />
    <label for="web">Web хаяг</label>
    <input id="web" type="text" autocomplete="off" spellcheck="false" required />
    <button id="save" class="primary" type="submit">Хадгалах</button>
  </form>

  <script>
    const internals = window.__TAURI_INTERNALS__;
    function invoke(command, payload) {
      if (!internals || typeof internals.invoke !== "function") {
        return Promise.reject(new Error("IPC боломжгүй"));
      }
      return internals.invoke(command, payload || {});
    }

    const el = (id) => document.getElementById(id);

    function notice(message, ok) {
      const alert = el("alert");
      if (!message) { alert.classList.add("hidden"); return; }
      alert.textContent = message;
      alert.className = "alert " + (ok ? "alert--ok" : "alert--error");
    }

    invoke("prefs_get").then((prefs) => {
      el("api").value = prefs.api_url;
      el("web").value = prefs.web_url;
      if (!prefs.editable) {
        // Production build-д хаягууд compile-time тогтмол: суулгасан бүрхүүл
        // танихгүй сервер рүү чиглэх боломжгүй байх нь аюулгүй байдлын
        // шаардлага.
        el("api").disabled = true;
        el("web").disabled = true;
        el("save").disabled = true;
        el("lede").textContent = "Энэ build-д хаягууд түгжээтэй.";
      }
    }).catch((err) => notice(String(err && err.message ? err.message : err), false));

    el("form").addEventListener("submit", (event) => {
      event.preventDefault();
      notice("", true);
      invoke("prefs_set", { apiUrl: el("api").value.trim(), webUrl: el("web").value.trim() })
        .then(() => notice("Хадгалагдлаа. Ажлын муж дахин ачаалагдав.", true))
        .catch((err) => notice(String(err && err.message ? err.message : err), false));
    });
  </script>
</body>
</html>
