# monitor.fuelnet.gerege.mn — Grafana.
#
# A hostname of its own rather than /grafana on the platform's, because the
# thing behind it is a different system with a different lifecycle: the
# monitoring stack is a separate compose project that can be taken down at any
# hour without the platform noticing, and a path on the platform's vhost would
# make it look like part of the product.
#
# Grafana is told to serve from this host's ROOT — GF_SERVER_ROOT_URL and
# GF_SERVER_SERVE_FROM_SUB_PATH=false in .env.monitoring. The two have to agree
# with this file: if Grafana thinks it lives under /grafana and nginx serves it
# at /, every link it generates points somewhere that does not exist.
#
# Install:
#
#   1. Bring the monitoring stack up (docs/MONITORING.md).
#   2. Copy this file to /etc/nginx/sites-available and link it into
#      sites-enabled.
#   3. certbot --nginx -d monitor.fuelnet.gerege.mn
#
# What is NOT published here: Prometheus (9091), Loki (3100), Tempo (3200),
# cAdvisor (8085) and every exporter. Prometheus has no authentication at all
# and its query API will describe the whole deployment to anyone who asks.
# Grafana is the only one of them built to face a person, and it is the only
# one behind this vhost.

# The sign-in budget for this host, separate from the platform's and from the
# console's. Sharing one would let an attack on any of them consume the budget
# an engineer needs to open a dashboard during the incident that attack caused.
limit_req_zone $binary_remote_addr zone=monitor_auth:10m rate=5r/m;

server {
    listen 80;
    server_name monitor.fuelnet.gerege.mn;

    # certbot rewrites this block when it issues, and needs the challenge path
    # to answer before there is any certificate to redirect to.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # A dashboard is not for search engines, previews, or anything else that
    # follows a link it found — and the panel titles alone describe the
    # deployment's internals.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Not DENY: Grafana's own panel-embedding and its rendering both use
    # same-origin frames.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Signing in, rate limited. Grafana locks an account after repeated
    # failures, but the lockout is per user and this is per address — which is
    # the one that costs a spraying attack anything.
    location /login {
        limit_req zone=monitor_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana's live tail and its dashboard refresh use websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A query over a wide range takes a while, and the default 60s read
        # timeout turns that into a 504 which reads as "Grafana is broken".
        proxy_read_timeout 300s;

        # Dashboard JSON compresses well and some of these are large.
        gzip on;
        gzip_proxied any;
        gzip_types application/json text/css application/javascript;
    }
}
