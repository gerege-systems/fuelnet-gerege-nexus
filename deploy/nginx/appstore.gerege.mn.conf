# appstore.gerege.mn — the public storefront and the registry API.
#
# Upstream ports come from deploy/appstore/docker-compose.prod.yml and are
# published on loopback only: 3009 storefront, 8083 registry. Scoped to one
# server_name, never default_server — this host also serves nexus.gerege.mn,
# developer.gerege.mn and sso.gerege.mn from their own vhosts.
#
# Install this file BEFORE running certbot. Certbot rewrites it in place: it
# adds the `listen 443 ssl` lines plus the port-80 redirect. Do not hand-write
# those — let certbot own them, or renewal stops finding its anchors.

server {
    listen 80;
    server_name appstore.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # The registry's own well-known document: the public keys a catalogue may be
    # signed with. It has to be reachable at the domain root, which is why it
    # comes before the storefront's catch-all.
    location = /.well-known/appstore-keys.json {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The catalogue every Nexus instance in the field polls.
    #
    # If-None-Match has to survive the hop or every instance re-downloads the
    # whole catalogue every hour; nginx forwards request headers by default, and
    # this is the one place where losing one would be expensive and invisible.
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # The storefront upstream sets none of these itself. `always` matters:
        # without it nginx omits them on its own error responses, which are the
        # easiest ones to provoke.
        #
        # X-Frame-Options is DENY here as everywhere else in this deployment: a
        # storefront framed inside somebody else's page is a storefront being
        # used to dress up something that is not Gerege.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
