# The OpenID Connect endpoints, routed to the API.
#
# They sit at the root of the domain because that is where the specification
# puts them and what SSO_ISSUER advertises — but the nexus vhost sends `/` to
# the frontend, so without this every one of them lands on the Next.js app.
# Only /oauth2/token was ever routed, which was enough for the token exchange
# and for nothing else: /oauth2/auth answered with the shell's HTML, so any
# client outside this deployment — the publishing console at
# developer.gerege.mn, or any third-party app installed from the store —
# could start a sign-in and never arrive.
#
# Included from the vhost rather than written into it, so that adding it to a
# server whose TLS block certbot manages does not mean rewriting that block.
#
#   include snippets/nexus-oauth.conf;
#
# `location = /oauth2/token` in the vhost keeps its rate limit: an exact match
# wins over the prefix below, which is what nginx guarantees.

location /oauth2/ {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The discovery document and the key set. A verifier that cannot read these
# cannot check a token this platform signed — the registry at
# appstore.gerege.mn reads the second one on every publish.
location = /.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/jwks.json {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The keys a catalogue may be signed with, served by the appstore_registry
# module. It is what lets an instance follow a signing-key rotation without a
# redeploy: it reads this, finds the new key id, and keeps accepting catalogues.
#
# Routed on every Nexus vhost rather than only on the App Store's, because the
# module is compiled into every build and answers 503 where no key is
# configured. A 404 from the frontend would be indistinguishable from "this
# deployment is too old to have the endpoint", which is exactly the question a
# client is asking when it looks.
location = /.well-known/appstore-keys.json {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The installation's Өртөө identity: the public key a subordinate installation
# verifies its parent's envelopes with, read before any link exists.
#
# Routed on the same argument the App Store key set is routed on. It is
# compiled into every build and answers a JSON 404 where no signing key is
# configured, which is a real answer — "this installation does not run Өртөө".
# Left to the frontend it would be an HTML 404 instead, indistinguishable from
# "this deployment is too old to have the endpoint", and the administrator
# establishing the link would be reading the wrong error.
#
# The exchange itself needs nothing here: it lives under /api/v1/urtuu/ and the
# vhost already proxies /api/ with a 90s read timeout, which the 25s long poll
# fits inside.
location = /.well-known/urtuu.json {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
