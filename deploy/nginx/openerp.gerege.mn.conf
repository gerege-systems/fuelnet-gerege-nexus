# Nginx Reverse Proxy Configuration for openerp.gerege.mn
# Supports both HTTP (port 80) and HTTPS (port 443) cleanly without blocking users before SSL setup.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name openerp.gerege.mn *.gerege.mn _;

    # Allow Let's Encrypt Certbot challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Frontend Next.js Proxy (Port 80)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Proxy (Port 80)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus Metrics
    location /metrics {
        proxy_pass http://127.0.0.1:8080/metrics;
        allow 127.0.0.1;
        deny all;
    }
}

# Optional HTTPS Block (Activated when Let's Encrypt certificate is issued)
server {
    listen 443 ssl http2;
    server_name openerp.gerege.mn;

    ssl_certificate /etc/letsencrypt/live/openerp.gerege.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openerp.gerege.mn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend Next.js Proxy (Port 443)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Proxy (Port 443)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
