# developer.gerege.mn — the publishing console.
#
# Upstream 3010 from deploy/appstore/docker-compose.prod.yml, loopback only.
# The console talks to the registry from its own server side, so nothing here
# proxies the registry: the browser has no reason to reach it and is not given
# one.
#
# Note for whoever owns this domain: it is referenced elsewhere in Gerege as the
# eID developer portal. If both have to live here, put one of them on a subpath
# rather than widening this server block — a vhost that answers for two products
# is how one of them silently starts serving the other's 404s.
#
# Install this file BEFORE running certbot; certbot rewrites it in place.

server {
    listen 80;
    server_name developer.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        # A console that holds a sign-in session must not be framable at all.
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
