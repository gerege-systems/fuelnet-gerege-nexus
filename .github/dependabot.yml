version: 2

# security.yml says when a dependency has become dangerous. Nothing said when
# one had merely become old, and those are the same fact separated by time:
# GO-2026-6222 was found here by a scan that had to fail first.
#
# Dependabot rather than Renovate: Renovate is a GitHub App somebody has to
# install and grant access to. This file works when it merges.
#
# Everything is grouped and weekly. A pull request per module produces a review
# queue nobody reads, which is worse than no automation because it looks like
# automation.

updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      # Next and React move together and break together; reviewing them apart
      # means reviewing a combination nobody will ever run.
      next:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react*"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - next
          - react
          - react-dom
          - "@types/react*"
    # Tailwind 4 is a migration, not a bump: the PostCSS plugin moved to its own
    # package and the configuration file becomes CSS. It arrived inside a group
    # of six on 2026-08-15 (#145), failed the build for exactly that reason, and
    # took the five updates beside it down with it.
    #
    # Ignored until somebody does the migration deliberately. Without this the
    # same broken pull request returns every Monday, which is the review queue
    # nobody reads that the note at the top of this file is about. Only the
    # major is held back — 4.x patches will still arrive once it is on 4.
    ignore:
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"

  # Workflows pin actions by major tag, which floats — until the author ships a
  # new major and the pin stops receiving anything, silently, for years.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
