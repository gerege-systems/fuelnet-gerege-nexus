name: Native release artifacts
on:
  push:
    tags: ["native-v*"]
permissions: { contents: read }
jobs:
  windows:
    runs-on: windows-latest
    strategy: { matrix: { form_factor: [Desktop, Kiosk, POS] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:FormFactor=${{ matrix.form_factor }}
        working-directory: desktop-native/Windows
      - uses: actions/upload-artifact@v4
        with: { name: windows-${{ matrix.form_factor }}-win-x64, path: desktop-native/Windows/bin/Release/${{ matrix.form_factor }}/net8.0-windows*/win-x64/publish }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :app:assembleMobileRelease :app:assembleTabletRelease :app:assembleKioskRelease :app:assemblePosRelease
        working-directory: desktop-native/Android
      - uses: actions/upload-artifact@v4
        with: { name: android-all-form-factors-unsigned, path: desktop-native/Android/app/build/outputs/apk/*/release/*.apk }
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
        working-directory: desktop-native/macOS
      - run: xcodebuild -quiet -scheme GeregeNexusApp -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
        working-directory: desktop-native/Apple
      - uses: actions/upload-artifact@v4
        with: { name: macos-arm64-unsigned, path: desktop-native/macOS/GeregeNexusNativeMac }
