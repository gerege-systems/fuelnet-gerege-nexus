name: Native clients

on:
  push:
    branches: [main]
    paths: ["native-apps/**", ".github/workflows/native-clients.yml"]
  pull_request:
    branches: [main]
    paths: ["native-apps/**", ".github/workflows/native-clients.yml"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
        working-directory: native-apps/macOS
      - run: swift test
        working-directory: native-apps/iOS
      - run: xcodebuild -quiet -scheme GeregeShellUI -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
        working-directory: native-apps/iOS
      - run: xcodebuild -quiet -scheme GeregeNexusApp -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
        working-directory: native-apps/iOS
  windows:
    strategy:
      matrix:
        form_factor: [Desktop, Kiosk, POS]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build GeregeNexusWin.csproj --configuration Release -p:FormFactor=${{ matrix.form_factor }}
        working-directory: native-apps/windows
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :core:test :app:compileMobileDebugKotlin :app:compileTabletDebugKotlin :app:compileKioskDebugKotlin :app:compilePosDebugKotlin
        working-directory: native-apps/android
