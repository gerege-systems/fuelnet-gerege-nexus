name: Deploy DS (ds.nexus.gerege.mn)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ds-production-deploy
  cancel-in-progress: false

env:
  PUBLIC_ORIGIN: https://ds.nexus.gerege.mn

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: deploy/Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/ds-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_ORIGIN }}/api/v1

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "value=${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DS_DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DS_DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml,docker-compose.ds.yml
          target: /opt/open-gerege-nexus-ds
      - uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.DS_POSTGRES_PASSWORD }}
          SSO_DEFAULT_CLIENT_SECRET: ${{ secrets.DS_SSO_DEFAULT_CLIENT_SECRET }}
          PUSH_TOKEN_ENCRYPTION_KEY: ${{ secrets.DS_PUSH_TOKEN_ENCRYPTION_KEY }}
        with:
          host: ${{ vars.DS_DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DS_DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN,POSTGRES_PASSWORD,SSO_DEFAULT_CLIENT_SECRET,PUSH_TOKEN_ENCRYPTION_KEY
          script: |
            set -euo pipefail
            cd /opt/open-gerege-nexus-ds
            umask 077
            cat > .env <<EOF
            IMAGE_BACKEND=ghcr.io/gerege-systems/open-gerege-nexus-desktop/ds-backend
            IMAGE_FRONTEND=ghcr.io/gerege-systems/open-gerege-nexus-desktop/ds-frontend
            IMAGE_TAG=${IMAGE_TAG}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            SSO_DEFAULT_CLIENT_SECRET=${SSO_DEFAULT_CLIENT_SECRET}
            PUSH_TOKEN_ENCRYPTION_KEY=${PUSH_TOKEN_ENCRYPTION_KEY}
            PUBLIC_ORIGIN=https://ds.nexus.gerege.mn
            REDIS_URL=redis://redis:6379/0
            DEMO_MODE=true
            EID_MOCK_MODE=true
            EID_JIT_TENANT_SLUG=demo
            EOF
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker compose -f docker-compose.prod.yml -f docker-compose.ds.yml pull
            docker compose -f docker-compose.prod.yml -f docker-compose.ds.yml up -d --remove-orphans
            docker logout ghcr.io
      - name: Verify DS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DS_DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DS_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8096/health >/dev/null && curl -fsS http://127.0.0.1:3012/ >/dev/null && exit 0
              sleep 5
            done
            docker compose -f /opt/open-gerege-nexus-ds/docker-compose.prod.yml -f /opt/open-gerege-nexus-ds/docker-compose.ds.yml logs --tail=100
            exit 1
