name: CI

on:
  push:
    branches: [main, master, V2]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run tests
        run: go test -race ./...

  swag-drift:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest
      - name: Regenerate spec
        env:
          GOFLAGS: "-mod=mod"
        run: swag init -g cmd/api/main.go --output docs --parseDependency --parseInternal
      - name: Check spec diff
        working-directory: .
        run: |
          if ! git diff --exit-code -- backend/docs/; then
            echo "::warning::docs/ changed after regeneration."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build binary
        working-directory: backend
        run: go build -o bin/api ./cmd/api/main.go
      - name: Build Docker image
        run: docker build -f deploy/Dockerfile .
