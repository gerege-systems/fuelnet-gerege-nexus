name: Deploy to Production (openerp.gerege.mn)

# Lint/test/build live in ci.yml — this workflow only publishes and deploys
# an already-green commit on the release branches.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  # Required to push images to ghcr.io — without it the push step fails with
  # "denied: installation not allowed to Write the repository".
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase repository paths; github.repository keeps the
      # owner's original casing.
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to openerp.gerege.mn
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # Skip cleanly on forks/clones where deployment secrets are absent instead
    # of failing the run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'gerege-systems/open-gerege-mn-erp' }}
    steps:
      - name: Check deployment secrets
        id: guard
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::warning::DEPLOY_SSH_KEY is not configured — skipping remote deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        with:
          host: ${{ secrets.DEPLOY_HOST || 'openerp.gerege.mn' }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE
          script: |
            set -euo pipefail
            APP_DIR=/opt/open-gerege-mn-erp
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE:latest"
            # Apply pending database migrations before swapping the API over.
            docker run --rm --network host --env-file "$APP_DIR/.env" "$IMAGE:latest" /app/migrate up
            docker compose up -d --remove-orphans
            docker system prune -f
