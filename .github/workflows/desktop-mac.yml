name: Desktop Shell (macOS)

# The Swift shell is the reference implementation of the bridge contract, and
# until now nothing compiled it outside a developer's laptop. It is a plain
# `swiftc` invocation over a fixed file list — which is exactly the kind of
# build that breaks quietly: a new file under src/ that nobody adds to
# build.sh compiles fine locally in an editor and is simply absent from the
# binary, and a file that stops compiling is only noticed by whoever next
# happens to run the script.
#
# Like the Tauri workflow, this verifies the build; it does not produce a
# distributable app. build.sh signs ad-hoc (`--sign -`), which is enough to
# launch on the machine that built it and is not a substitute for a Developer
# ID identity plus notarisation.

on:
  push:
    branches: [main]
    # Same caveat as desktop-tauri.yml: a path-filtered workflow reports no
    # status on runs that miss the filter, so it cannot be a required check on
    # its own.
    paths:
      - "desktop-mac/**"
      - ".github/workflows/desktop-mac.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop-mac/**"
      - ".github/workflows/desktop-mac.yml"

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-path)"

      # The one thing a fixed file list cannot tell you: whether it still names
      # every source. A file present in src/ but missing from build.sh is not a
      # compile error — it is dead code that silently never ships.
      - name: Check build.sh names every Swift source
        run: |
          missing=0
          for file in desktop-mac/src/*.swift; do
            name="$(basename "$file")"
            if ! grep -q "src/$name" desktop-mac/build.sh; then
              echo "::error file=desktop-mac/build.sh::$name is in src/ but not compiled by build.sh"
              missing=1
            fi
          done
          exit $missing

      - name: Build
        run: ./desktop-mac/build.sh

      # build.sh runs under `set -e`, so a failed compile already fails the job.
      # This catches the other shape of failure: a script that exits 0 having
      # produced a bundle macOS would refuse to launch.
      - name: Verify the app bundle
        run: |
          BUNDLE="desktop-mac/build/Gerege Nexus.app"
          BINARY="$BUNDLE/Contents/MacOS/Gerege Nexus"
          test -f "$BUNDLE/Contents/Info.plist" || { echo "::error::Info.plist missing"; exit 1; }
          test -x "$BINARY" || { echo "::error::executable missing or not executable"; exit 1; }
          file "$BINARY"
          codesign --verify --strict --verbose=2 "$BUNDLE"

      # The contract's security rules are the reason this shell was rewritten;
      # a regression here is invisible until someone exploits it. These two
      # patterns are the ones that were actually removed — a bare `evaluateJavaScript`
      # built by string interpolation, and a user script injected into every frame.
      - name: Check the bridge has not regressed
        run: |
          failed=0
          if grep -rn "forMainFrameOnly: false" desktop-mac/src/; then
            echo "::error::a WKUserScript is injected into subframes — the bridge must be main-frame only"
            failed=1
          fi
          # Interpolation inside a JS string literal is the exact shape of the
          # hole that was closed: "...'\(value)'...".
          if grep -rnE "let js = \".*\\\\\(" desktop-mac/src/; then
            echo "::error::JavaScript is being built by string interpolation — serialise through jsStringLiteral/JSON instead"
            failed=1
          fi
          exit $failed
