name: Security

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    # The Go module lives in backend/. Running from the repository root
    # aborts with "go.mod file not found".
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...

  gosec:
    name: Static Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # gosec catches a different class of issues than govulncheck:
      # govulncheck reads vuln DB → flags vulnerable deps; gosec reads
      # source → flags antipatterns (hardcoded creds, weak crypto,
      # SQL injection patterns, unsafe file perms, etc.).
      - name: Run gosec
        uses: securego/gosec@master
        with:
          # G104 (errcheck) is noisy and golangci-lint already covers it.
          # G404 (math/rand) is only used for circuit-breaker jitter — never
          # for tokens or secrets, which use crypto/rand.
          args: "-exclude=G104,G404 ./backend/..."
